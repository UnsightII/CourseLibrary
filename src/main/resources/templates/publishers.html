<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>Publishers</title>

    <meta name="viewport" content="width=device-width, initial-scale=1">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css"
          rel="stylesheet"
          integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC"
          crossorigin="anonymous">

    <link rel="stylesheet"
          href="https://use.fontawesome.com/releases/v5.4.1/css/all.css">
</head>

<body>

<div th:insert="fragments/header :: header"></div>

<div class="container my-2">
    <div class="card">
        <div class="card-body">

            <div class="col-md-10">

                <h2>Publishers</h2>

                <a th:href="@{/add-publisher}" class="btn btn-primary mb-3">
                    Add Publisher
                </a>

                <table class="table table-bordered table-hover">

                    <thead>
                    <tr>
                        <th>ID</th>
                        <th>Publisher Name</th>
                        <th>Actions</th>
                    </tr>
                    </thead>

                    <tbody>

                    <tr th:each="publisher : ${publishers}">
                        <td th:text="${publisher.id}"></td>
                        <td th:text="${publisher.name}"></td>

                        <td>
                            <a th:href="@{/update-publisher/{id}(id=${publisher.id})}"
                               class="btn btn-warning me-2">
                                <i class="fas fa-edit"></i> Update
                            </a>

                            <a th:href="@{/remove-publisher/{id}(id=${publisher.id})}"
                               class="btn btn-danger">
                                <i class="fas fa-trash-alt"></i> Delete
                            </a>
                        </td>
                    </tr>

                    </tbody>

                </table>

            </div>

        </div>
    </div>
</div>

</body>
</html>
