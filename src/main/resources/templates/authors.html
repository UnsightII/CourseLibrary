<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>Authors</title>

    <meta name="viewport" content="width=device-width, initial-scale=1">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css"
          rel="stylesheet"
          integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC"
          crossorigin="anonymous">

    <link rel="stylesheet"
          href="https://use.fontawesome.com/releases/v5.4.1/css/all.css">
</head>

<body>

<div th:insert="fragments/header :: header"></div>

<div class="container my-5">

    <div class="card">
        <div class="card-body">

            <a th:href="@{/add-author}" class="btn btn-primary mb-4">
                <i class="fas fa-user-plus"></i> Add Author
            </a>

            <table class="table table-striped">

                <thead>
                <tr>
                    <th>#</th>
                    <th>Name</th>
                    <th>Description</th>
                    <th class="text-center">Edit</th>
                    <th class="text-center">Delete</th>
                </tr>
                </thead>

                <tbody>

                <tr th:each="author : ${authors}">

                    <td th:text="${author.id}"></td>

                    <td th:text="${author.name}"></td>

                    <td th:text="${author.description}"></td>

                    <td class="text-center">
                        <a th:href="@{/update-author/{id}(id=${author.id})}"
                           class="btn btn-primary btn-sm">
                            <i class="fas fa-user-edit"></i>
                        </a>
                    </td>

                    <td class="text-center">
                        <a th:href="@{/remove-author/{id}(id=${author.id})}"
                           class="btn btn-primary btn-sm"
                           onclick="return confirm('Delete this author?')">
                            <i class="fas fa-user-times"></i>
                        </a>
                    </td>

                </tr>

                </tbody>

            </table>

        </div>
    </div>

</div>

</body>
</html>
