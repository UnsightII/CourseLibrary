<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="x-ua-compatible" content="ie=edge">
    <title>Add Book</title>

    <meta name="viewport"
          content="width=device-width, initial-scale=1">

    <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css"
            rel="stylesheet"
            integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC"
            crossorigin="anonymous">

    <link
            rel="stylesheet"
            href="https://use.fontawesome.com/releases/v5.4.1/css/all.css">
</head>

<body>

<div th:insert="fragments/header :: header"></div>

<div class="container my-2">

    <div class="card">

        <div class="card-body">

            <form action="#"
                  th:action="@{/save-book}"
                  th:object="${book}"
                  method="post">

                <div class="row">

                    <!-- ISBN -->
                    <div class="form-group col-md-8">
                        <label for="isbn" class="col-form-label">ISBN</label>
                        <input type="text"
                               id="isbn"
                               class="form-control"
                               th:field="*{isbn}"
                               placeholder="ISBN">
                    </div>

                    <!-- Book Name -->
                    <div class="form-group col-md-8">
                        <label for="name" class="col-form-label">Book Name</label>
                        <input type="text"
                               id="name"
                               class="form-control"
                               th:field="*{name}"
                               placeholder="Book Name">
                    </div>

                    <!-- Description -->
                    <div class="form-group col-md-8">
                        <label for="description" class="col-form-label">
                            Book Description
                        </label>
                        <input type="text"
                               id="description"
                               class="form-control"
                               th:field="*{description}"
                               placeholder="Book Description">
                    </div>

                    <!-- Category -->
                    <div class="form-group col-md-8">
                        <label for="categories" class="col-form-label">
                            Category
                        </label>

                        <select id="categories"
                                class="form-control"
                                th:field="*{categories}">

                            <option th:each="category : ${categories}"
                                    th:value="${category.id}"
                                    th:text="${category.name}">
                            </option>

                        </select>
                    </div>

                    <!-- Author -->
                    <div class="form-group col-md-8">
                        <label for="author" class="col-form-label">
                            Author
                        </label>

                        <select id="author"
                                class="form-control"
                                th:field="*{authors}">

                            <option th:each="author : ${authors}"
                                    th:value="${author.id}"
                                    th:text="${author.name}">
                            </option>

                        </select>
                    </div>

                    <!-- Publisher -->
                    <div class="form-group col-md-8">
                        <label for="publisher" class="col-form-label">
                            Publisher
                        </label>

                        <select id="publisher"
                                class="form-control"
                                th:field="*{publishers}">

                            <option th:each="publisher : ${publishers}"
                                    th:value="${publisher.id}"
                                    th:text="${publisher.name}">
                            </option>

                        </select>
                    </div>

                    <!-- Submit Button -->
                    <div class="col-md-6">
                        <input type="submit"
                               class="btn btn-primary"
                               value="Submit">
                    </div>

                </div>

            </form>

        </div>

    </div>

</div>

</body>

</html>
